name: doc_approval
description: Document Approval Workflow mobile app.
publish_to: "none"
version: 1.0.8+9

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Push Notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^10.1.4

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.0.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI / Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # Files
  file_picker: ^8.0.3
  open_filex: ^4.4.0
  path_provider: ^2.1.3

  # Misc
  intl: 0.20.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.1

  syncfusion_flutter_pdfviewer: 33.2.5
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  connectivity_plus: ^7.1.1
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-full-trans.png
    - assets/logo-symbol-gold.png
  # Cairo is loaded via google_fonts package — no font assets needed.
