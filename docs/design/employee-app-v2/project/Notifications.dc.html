<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإشعارات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#224167}a:hover{color:#1A3554}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F7FB; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; color: #1B2A41; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; padding: 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E4E6EE">
<a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; color: #224167; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700; flex: 1">الإشعارات</h1>
<button type="button" onClick="{{markAll}}" disabled="{{allRead}}" style="height: 40px; padding: 0 10px; border: 0; background: transparent; color: {{markFg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">تحديد الكل كمقروء</button>
</div>

<div style="flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 700; color: #6B7591">{{g.label}}</h2>
<div style="background: #FFFFFF; border: 1px solid #E4E6EE; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid #E4E6EE; text-decoration: none; color: #1B2A41; background: {{n.rowBg}}">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{n.bg}}; color: {{n.fg}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{n.isPay}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg></sc-if>
<sc-if value="{{n.isOk}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
<sc-if value="{{n.isLate}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
<sc-if value="{{n.isUpd}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="m3 17 6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg></sc-if>
<sc-if value="{{n.isCirc}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M3 10v4h4l8 5V5L7 10z"></path><path d="M18 9a4 4 0 0 1 0 6"></path></svg></sc-if>
<sc-if value="{{n.isContract}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 3h8l5 5v13H6z"></path><path d="M14 3v5h5"></path><circle cx="12" cy="15" r="3"></circle><path d="M12 13.5V15l1 1"></path></svg></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: {{n.weight}}">{{n.title}}</span><span style="flex-shrink: 0; font-size: 12px; color: #6B7591">{{n.time}}</span></span>
<span style="font-size: 13px; color: #6B7591; line-height: 1.6">{{n.body}}</span>
</span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span aria-label="غير مقروء" style="width: 8px; height: 8px; margin-top: 8px; flex-shrink: 0; border-radius: 999px; background: #224167"></span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { allRead: false };
  }
  renderVals() {
    const read = this.state.allRead;
    const T = {
      pay: { isPay: true, bg: '#E4F2EC', fg: '#2E7D5B' },
      ok: { isOk: true, bg: '#E4F2EC', fg: '#2E7D5B' },
      late: { isLate: true, bg: '#FDEBDD', fg: '#C2410C' },
      upd: { isUpd: true, bg: '#EEF0F6', fg: '#224167' },
      circ: { isCirc: true, bg: '#F2E4CC', fg: '#8A6A23' },
      contract: { isContract: true, bg: '#FDEBDD', fg: '#C2410C' }
    };
    const mk = (type, title, body, time, href, unread) => {
      const u = unread && !read;
      return { isPay: false, isOk: false, isLate: false, isUpd: false, isCirc: false, isContract: false, ...T[type], title, body, time, href, unread: u, weight: u ? '700' : '500', rowBg: u ? '#F8FAFE' : '#FFFFFF' };
    };
    return {
      allRead: read,
      markFg: read ? '#9099AD' : '#224167',
      markAll: () => this.setState({ allRead: true }),
      groups: [
        { label: 'اليوم', items: [
          mk('circ', 'تعميم جديد', 'تعديل أوقات الدوام الشتوي — يحتاج تأكيد اطلاعك', '09:00', 'Documents.dc.html', true),
          mk('contract', 'عقدك ينتهي قريباً', 'ينتهي عقدك الحالي في 31/12/2026، بعد 74 يوماً', '08:00', 'Account.dc.html', true),
          mk('ok', 'تمت الموافقة على طلبك', 'وافق رامي العلي على إجازتك المرضية، وهي الآن لدى الموارد البشرية', '07:45', 'RequestDetail.dc.html', true)
        ] },
        { label: 'هذا الأسبوع', items: [
          mk('late', 'تأخر في الحضور', 'السبت 17 تشرين الأول · سجّلت حضورك 08:24 بعد بداية الوردية بـ 24 دقيقة', 'السبت', 'Attendance.dc.html', false),
          mk('upd', 'تحديث على راتبك', 'أُضيف تعويض ندرة إلى راتبك اعتباراً من تشرين الأول', 'الخميس', 'Salary.dc.html', false),
          mk('pay', 'تم إيداع راتب أيلول', 'حُوّل صافي راتبك إلى حساب شام كاش', '30/09', 'Salary.dc.html', false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
